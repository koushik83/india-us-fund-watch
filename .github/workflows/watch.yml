name: US Fund Watch

on:
  schedule:
    # Hourly at :17 past, 05:47-23:47 IST. GitHub's cron is best-effort: runs
    # at :00 are the most congested and often delayed for hours or dropped, so
    # we use an odd minute and run often. The daily summary is not tied to a
    # slot -- watch.py sends it on the first run after 09:00 IST each day.
    - cron: '17 0-18 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'daily = send full summary, check = alert only on change'
        type: choice
        options: [daily, check, auto]
        default: daily

# Never let two runs race on data/status.json.
concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # commit data/
      actions: write    # keepalive (re-enable this workflow)

    steps:
      - uses: actions/checkout@v4

      - name: Pick mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          else
            echo "mode=auto" >> "$GITHUB_OUTPUT"
          fi

      # Runner's built-in python3; script is stdlib-only, so no setup/pip
      # steps that can rot over the years.
      - name: Check funds
        run: python3 watch.py ${{ steps.mode.outputs.mode }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONIOENCODING: utf-8

      # Runs even if the check failed, so health.json (broken state) is saved
      # and we don't re-alert every 2 hours.
      - name: Commit state
        if: always()
        run: |
          git config user.name  "fund-watch bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No state change."
            exit 0
          fi
          git commit -m "status $(TZ=Asia/Kolkata date +%Y-%m-%d_%H:%M) IST"
          git pull --rebase origin main
          git push origin main

      # GitHub disables scheduled workflows after 60 days without repo
      # activity. Daily commits already prevent that; this is belt-and-braces.
      - name: Keepalive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/watch.yml/enable" || true
